services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modelhub
      POSTGRES_PASSWORD: modelhub
      POSTGRES_DB: modelhub
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U modelhub"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment: { MEILI_MASTER_KEY: masterKey, MEILI_NO_ANALYTICS: "true" }
    ports: ["7700:7700"]
    volumes: ["meili_data:/meili_data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: modelhub, MINIO_ROOT_PASSWORD: modelhub123 }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://modelhub:modelhub@postgres:5432/modelhub?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/modelhub
    ports: ["3000:3000"]
    volumes: ["uploads_data:/app/public/uploads", "backups_data:/app/backups"]
volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:
  uploads_data:
  backups_data:
